<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXMENTOR Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Dark Mode Theme Variables */
        :root {
            --primary: #38bdf8; /* Cyan accent */
            --secondary: #0284c7;
            --bg: #0f172a; /* Deep dark background */
            --card: #1e293b; /* Slightly lighter dark for cards */
            --text: #f8fafc; /* Light text */
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); font-size: 26px; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: var(--text-muted); margin: 0; }
        
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 25px; border: 1px solid var(--border); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        
        button { width: 100%; background: var(--secondary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--primary); }
        
        .msg-list h3 { font-size: 18px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0; }
        
        /* Search Box */
        .search-box { width: 100%; padding: 12px; margin-bottom: 20px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s; }
        .search-box:focus { border-color: var(--primary); }
        
        .msg-item { background: var(--bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .msg-name { font-weight: 600; color: var(--primary); }
        
        .badge { font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 500; letter-spacing: 0.5px; }
        .badge.unread { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.read { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .msg-text { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MAXMENTOR Support</h1>
        <p>Ask a Question</p>
    </div>

    <!-- Question Form -->
    <div class="card">
        <form id="supportForm">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email Address (For reply)</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="message" rows="4" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Messages List -->
    <div class="card msg-list">
        <h3>Recent Queries</h3>
        
        <!-- Search Input -->
        <input type="email" id="searchEmail" class="search-box" placeholder="🔍 Search your query by Email...">
        
        <div id="messagesContainer">
            <!-- Messages will load here -->
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'maxmentor_cache';
    const SECRET_KEY = 'MAX811525'; // Encryption Key

    // --- Encryption Logic ---
    function encryptData(data) {
        const text = JSON.stringify(data);
        let encrypted = "";
        for (let i = 0; i < text.length; i++) {
            encrypted += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
        }
        return btoa(encrypted); // Base64 encoding
    }

    // --- Decryption Logic ---
    function decryptData(encryptedText) {
        try {
            const text = atob(encryptedText);
            let decrypted = "";
            for (let i = 0; i < text.length; i++) {
                decrypted += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
            }
            return JSON.parse(decrypted); // JSON me wapas convert
        } catch (e) {
            return []; // Agar file khali ya corrupt hai
        }
    }

    function getMessages() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return [];
        return decryptData(savedData);
    }

    function saveMessage(msg) {
        const msgs = getMessages();
        msgs.unshift(msg); 
        localStorage.setItem(STORAGE_KEY, encryptData(msgs)); // Encrypt karke save karo
    }

    function renderMessages(searchQuery = '') {
        const container = document.getElementById('messagesContainer');
        const msgs = getMessages();
        container.innerHTML = '';

        const filteredMsgs = msgs.filter(msg => 
            msg.email.toLowerCase().includes(searchQuery.toLowerCase())
        );

        if(filteredMsgs.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; margin-top:20px;">No queries found.</p>';
            return;
        }

        filteredMsgs.forEach(msg => {
            const statusBadge = msg.isRead 
                ? '<span class="badge read">✔ Read (Check your email)</span>' 
                : '<span class="badge unread">Pending</span>';
            
            container.innerHTML += `
                <div class="msg-item">
                    <div class="msg-header">
                        <span class="msg-name">${msg.name}</span>
                        ${statusBadge}
                    </div>
                    <div class="msg-text">${msg.message}</div>
                </div>
            `;
        });
    }

    document.getElementById('supportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const newMsg = {
            id: Date.now(),
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value,
            isRead: false
        };
        saveMessage(newMsg);
        this.reset();
        
        document.getElementById('searchEmail').value = '';
        renderMessages();
    });

    document.getElementById('searchEmail').addEventListener('input', function(e) {
        renderMessages(e.target.value);
    });

    renderMessages();

    window.addEventListener('storage', () => {
        const currentSearch = document.getElementById('searchEmail').value;
        renderMessages(currentSearch);
    });
</script>
</body>
</html>
