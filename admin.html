<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MAXMENTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Dark Mode Theme Variables */
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #f87171;
            --success: #34d399;
            --btn-bg: #0284c7;
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Container Setup */
        .container { width: 100%; max-width: 800px; }
        
        /* Login Screen Styles */
        #loginScreen { max-width: 400px; margin: 10vh auto; background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid var(--border); }
        #loginScreen h2 { color: var(--primary); margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .pin-input { width: 100%; padding: 15px; text-align: center; font-size: 24px; letter-spacing: 10px; background: var(--bg); color: var(--text); border: 2px solid var(--border); border-radius: 8px; outline: none; margin-bottom: 15px; transition: 0.3s; }
        .pin-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .error-msg { color: var(--error); font-size: 14px; margin-bottom: 15px; display: none; font-weight: 500; background: rgba(248, 113, 113, 0.1); padding: 8px; border-radius: 6px; }
        
        /* Admin Panel Styles */
        #adminPanel { display: none; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); border: 1px solid var(--border); color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 22px; color: var(--primary); }
        .logout-btn { background: rgba(248, 113, 113, 0.2); color: var(--error); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid rgba(248, 113, 113, 0.3); transition: 0.3s; }
        .logout-btn:hover { background: var(--error); color: white; }
        
        /* Bulk Actions Setup */
        .bulk-actions { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--primary); }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

        .admin-list { display: flex; flex-direction: column; gap: 15px; }
        .admin-item { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--error); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: 0.2s; }
        .admin-item.read { border-left-color: var(--success); opacity: 0.7; }
        .admin-item.selected { border-color: var(--primary); background-color: rgba(56, 189, 248, 0.05); }
        
        .info-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info strong { color: var(--text); font-size: 16px; }
        .user-info span { color: var(--text-muted); font-size: 13px; margin-left: 10px; }
        
        .msg-text { background: var(--bg); color: var(--text-muted); padding: 15px; border-radius: 8px; font-size: 14px; margin-top: 5px; border: 1px solid var(--border); line-height: 1.6; margin-left: 30px; } /* Margin left to align with text */
        
        /* Buttons Setup */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button.action-btn { background: var(--success); color: #064e3b; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button.action-btn:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(52, 211, 153, 0.3); }
        button.action-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        
        button.delete-btn { background: var(--error); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button.delete-btn:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(248, 113, 113, 0.3); }
        button.delete-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

        button.login-btn { width: 100%; background: var(--btn-bg); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        button.login-btn:hover { background: var(--primary); color: #0f172a; }
        
        @media (max-width: 600px) {
            .info-row { flex-direction: column; align-items: stretch; }
            .user-info span { margin-left: 0; display: block; margin-top: 4px; }
            .btn-group { width: 100%; display: flex; margin-top: 10px; }
            .btn-group button { flex: 1; padding: 12px; }
            .msg-text { margin-left: 0; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="container">
    <h2>🔒 Admin Access</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Enter your 6-digit PIN to continue.</p>
    <input type="password" id="pinInput" class="pin-input" maxlength="6" placeholder="••••••" autocomplete="off">
    <div id="errorMsg" class="error-msg">Incorrect PIN. Try again.</div>
    <button onclick="verifyPin()" class="login-btn">Login</button>
</div>

<div id="adminPanel" class="container">
    <div class="header">
        <h1>Admin Panel</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span style="color: var(--text-muted); font-size: 14px;">Messages: <b id="msgCount" style="color: var(--primary);">0</b></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="bulk-actions" id="bulkActions" style="display: none;">
        <label class="checkbox-label">
            <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()">
            Select All
        </label>
        <button class="delete-btn" id="bulkDeleteBtn" onclick="deleteSelected()" disabled>Delete Selected (0)</button>
    </div>

    <div class="admin-list" id="adminContainer">
        </div>
</div>

<script>
    const STORAGE_KEY = 'maxmentor_cache';
    const SECRET_KEY = atob('TUFYODExNTI1');
    let selectedIds = new Set(); 

    // --- Authentication System ---
    function checkAuth() {
        if (sessionStorage.getItem('maxmentor_admin_auth') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            renderAdminMessages();
        } else {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    }

    function verifyPin() {
        const pin = document.getElementById('pinInput').value;
        const encryptedInput = btoa(pin.split('').reverse().join(''));
        
        if (encryptedInput === 'NTI1MTE4') {
            sessionStorage.setItem('maxmentor_admin_auth', 'true');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('pinInput').value = '';
            checkAuth();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('pinInput').value = '';
        }
    }

    function logout() {
        sessionStorage.removeItem('maxmentor_admin_auth');
        selectedIds.clear(); // Clear selections on logout
        checkAuth();
    }

    document.getElementById('pinInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') verifyPin();
    });

    // --- Encryption Logic ---
    function encryptData(data) {
        const text = JSON.stringify(data);
        let encrypted = "";
        for (let i = 0; i < text.length; i++) {
            encrypted += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
        }
        return btoa(encrypted);
    }

    function decryptData(encryptedText) {
        try {
            const text = atob(encryptedText);
            let decrypted = "";
            for (let i = 0; i < text.length; i++) {
                decrypted += String.fromCharCode(text.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length));
            }
            return JSON.parse(decrypted);
        } catch (e) {
            return [];
        }
    }

    function getMessages() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) return [];
        return decryptData(savedData);
    }

    // --- Message Management (Read, Delete, Select) ---
    function markAsRead(id) {
        let msgs = getMessages();
        msgs = msgs.map(msg => {
            if (msg.id === id) { msg.isRead = true; }
            return msg;
        });
        localStorage.setItem(STORAGE_KEY, encryptData(msgs));
        renderAdminMessages();
    }

    // Ek Message Delete Karna
    function deleteSingle(id) {
        if(confirm("Are you sure you want to delete this message?")) {
            let msgs = getMessages();
            msgs = msgs.filter(msg => msg.id !== id);
            localStorage.setItem(STORAGE_KEY, encryptData(msgs));
            selectedIds.delete(id); // Agar selected tha to wahan se bhi hata do
            renderAdminMessages();
        }
    }

    // Checkbox Toggle (Select Ek-Ek Karke)
    function toggleSelection(id, isChecked) {
        if(isChecked) {
            selectedIds.add(id);
        } else {
            selectedIds.delete(id);
        }
        updateBulkDeleteUI();
    }

    // Select All Checkbox Logic
    function toggleSelectAll() {
        const isChecked = document.getElementById('selectAllCheckbox').checked;
        const checkboxes = document.querySelectorAll('.item-checkbox');
        const msgs = getMessages();
        
        selectedIds.clear();
        
        if(isChecked) {
            msgs.forEach(msg => selectedIds.add(msg.id));
            checkboxes.forEach(cb => cb.checked = true);
        } else {
            checkboxes.forEach(cb => cb.checked = false);
        }
        
        renderAdminMessages(); // Re-render to show selected background styles
    }

    // Selected Messages (Bulk) Delete Karna
    function deleteSelected() {
        if(selectedIds.size === 0) return;
        
        if(confirm(`Are you sure you want to delete ${selectedIds.size} messages?`)) {
            let msgs = getMessages();
            msgs = msgs.filter(msg => !selectedIds.has(msg.id));
            localStorage.setItem(STORAGE_KEY, encryptData(msgs));
            
            selectedIds.clear();
            document.getElementById('selectAllCheckbox').checked = false;
            renderAdminMessages();
        }
    }

    // Update Bulk Delete Button Status
    function updateBulkDeleteUI() {
        const msgs = getMessages();
        const bulkBtn = document.getElementById('bulkDeleteBtn');
        const selectAllCb = document.getElementById('selectAllCheckbox');
        
        bulkBtn.disabled = selectedIds.size === 0;
        bulkBtn.innerText = `Delete Selected (${selectedIds.size})`;
        
        // Agar saare messages manually tick kiye, toh 'Select All' tick kar do
        if(msgs.length > 0 && selectedIds.size === msgs.length) {
            selectAllCb.checked = true;
        } else {
            selectAllCb.checked = false;
        }

        // Apply selected background dynamically
        const items = document.querySelectorAll('.admin-item');
        items.forEach(item => {
            const cb = item.querySelector('.item-checkbox');
            if(cb.checked) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        });
    }

    // --- Render System ---
    function renderAdminMessages() {
        const container = document.getElementById('adminContainer');
        const bulkActionsDiv = document.getElementById('bulkActions');
        const msgs = getMessages();
        
        document.getElementById('msgCount').innerText = msgs.length;
        container.innerHTML = '';

        if(msgs.length === 0) {
            bulkActionsDiv.style.display = 'none'; // Message nahi toh hide karo
            container.innerHTML = '<div class="admin-item"><p style="text-align:center; color: var(--text-muted); margin:0;">No queries found.</p></div>';
            return;
        }

        bulkActionsDiv.style.display = 'flex';

        msgs.forEach(msg => {
            const isSelected = selectedIds.has(msg.id);
            container.innerHTML += `
                <div class="admin-item ${msg.isRead ? 'read' : ''} ${isSelected ? 'selected' : ''}">
                    <div class="info-row">
                        <div class="user-info">
                            <input type="checkbox" class="item-checkbox" value="${msg.id}" 
                                onchange="toggleSelection(${msg.id}, this.checked)" ${isSelected ? 'checked' : ''}>
                            <div>
                                <strong>${msg.name}</strong> 
                                <span>📧 ${msg.email}</span>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="action-btn" 
                                onclick="markAsRead(${msg.id})" 
                                ${msg.isRead ? 'disabled' : ''}>
                                ${msg.isRead ? '✔ Read' : 'Mark as Read'}
                            </button>
                            <button class="delete-btn" onclick="deleteSingle(${msg.id})">
                                🗑 Delete
                            </button>
                        </div>
                    </div>
                    <div class="msg-text">${msg.message}</div>
                </div>
            `;
        });
        
        updateBulkDeleteUI();
    }

    checkAuth();

    window.addEventListener('storage', function() {
        if (sessionStorage.getItem('maxmentor_admin_auth') === 'true') {
            renderAdminMessages();
        }
    });
</script>
</body>
</html>
